name: Cyberbot offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

      - name: Windows pilot script parse and preview
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          foreach ($file in @('scripts/register-pilot-windows.ps1','scripts/pilot-supervisor-windows.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          & .\scripts\register-pilot-windows.ps1

      - name: Extended synthetic stress suite
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m tools.stress --steps 240

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt "playwright>=1.50,<2"
      - run: python -m playwright install --with-deps chromium
      - run: python -m tools.panel_smoke
