name: Cyberbot offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Install optional Futures AI models (Linux and Windows 3.12)
        if: matrix.python == '3.12'
        run: python -m pip install -r requirements-futures-ai.txt
      - run: python -m unittest discover -s tests -v

      - name: Windows pilot script parse and preview
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          foreach ($file in @('scripts/register-pilot-windows.ps1','scripts/pilot-supervisor-windows.ps1','scripts/prepare-pilot-windows.ps1','scripts/futures-windows.ps1','scripts/central-windows.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          & .\scripts\register-pilot-windows.ps1
          & .\scripts\futures-windows.ps1
          $preview = & .\scripts\central-windows.ps1 | ConvertFrom-Json
          if ($preview.writes -ne $false -or $preview.network -ne $false -or $preview.starts_services -ne $false -or $preview.real_orders -ne $false) { throw 'Central preview must be non-mutating.' }
          foreach ($mode in @('Prepare','StatusAll','StartPanel','StartNotifications')) { if ($mode -notin $preview.modes) { throw 'Central management mode missing.' } }

      - name: Windows AI script parse and safe previews
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          foreach ($file in @('scripts/ai-research-windows.ps1','scripts/setup-ai-windows.ps1','scripts/ai-readiness-windows.ps1','scripts/register-ai-research-windows.ps1','scripts/ai-watchdog-windows.ps1','scripts/register-ai-review-windows.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          & .\scripts\register-ai-research-windows.ps1
          & .\scripts\register-ai-review-windows.ps1
          & .\scripts\setup-ai-windows.ps1 -IncludeReviewRuntime
          $readiness = & .\scripts\ai-readiness-windows.ps1 | ConvertFrom-Json
          if ($readiness.version -ne 'ai-readiness-2' -or $readiness.tasks_modified -ne $false -or $readiness.real_orders -ne $false -or $readiness.paper_readiness_verified -ne $false -or $readiness.native_inference_verified -ne $false) { throw 'Unsafe readiness report.' }
          $required = @('Chronos','LightGBM','River','ReviewRuntime-LightGBM','ReviewRuntime-River','CPUAdmission','RuntimeInstallDisk','Task-ResearchReview')
          foreach ($name in $required) {
            if (@($readiness.checks | Where-Object { $_.name -eq $name }).Count -ne 1) { throw ('Missing or duplicate readiness check: ' + $name) }
          }
          if (Get-ScheduledTask -TaskPath '\' -TaskName 'Cyberbot-AI-ResearchReview' -ErrorAction SilentlyContinue) { throw 'Preview unexpectedly registered a task.' }

      - name: Extended synthetic stress suite
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m tools.stress --steps 240

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt "playwright>=1.50,<2"
      - run: python -m playwright install --with-deps chromium
      - run: python -m tools.panel_smoke

  ai-native-river:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native River runtime
        run: python -m pip install --only-binary=:all: 'river==0.23.0'
      - name: Exercise actual River replay and measure CPU and memory
        run: |
          /usr/bin/time -v python - <<'PY'
          import json, math, time, river
          from tools.local_research.river_review import evaluate
          from tools.local_research.river_journal import replay
          from tools.local_research.river_live_shadow import make_model
          from datetime import datetime, timedelta, timezone
          started = time.monotonic()
          p = [100.]
          for i in range(10000):
              p.append(p[-1]*(1+0.001*math.sin(i/7)))
          result = evaluate(p)
          assert result['updates'] == 9980
          assert result['scored'] == 9920
          assert all(math.isfinite(v) for v in result['paired_mae_pct'].values())
          assert result['real_orders'] is False
          assert result['automatic_promotion'] is False
          rows = []
          start = datetime(2020, 1, 1, tzinfo=timezone.utc)
          for i in range(1000):
              t = start + timedelta(minutes=i*22)
              y = 0.1*math.sin(i/7)
              pred = {'naive':0., 'mean':0.05*math.sin(i/7), 'ar1':0.04*math.cos(i/7), 'chronos':0.08*math.sin(i/7)}
              payload = dict(mode='forward_shadow_research', context_bars=21, prediction_bars=1, automatic_promotion=False, real_orders=False, last_price=100, predictions=pred)
              outcome = dict(actual_return_pct=y, target_source_at=(t+timedelta(seconds=50)).isoformat(), execution_verified=False, real_orders=False, absolute_errors_pct={k:abs(y-v) for k,v in pred.items()})
              rows.append((int(t.timestamp()//60),(t+timedelta(seconds=15)).isoformat(),json.dumps(payload),json.dumps(outcome)))
          a = replay(rows,make_model())
          b = replay(rows,make_model())
          assert a == b and a['scored'] == 940
          assert a['real_orders'] is False
          print(json.dumps({'river_version':river.__version__,'synthetic_price_updates':result['updates'],'replay_observations':a['observations'],'reconstruction_match':True,'elapsed_seconds':time.monotonic()-started,'real_orders':False},allow_nan=False))
          PY
