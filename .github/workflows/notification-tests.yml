name: Notification offline tests
on:
  push:
    branches: [feature/notification-news-center]
    paths:
      - 'tools/notification_*'
      - 'tests/test_notification_*'
      - '.github/workflows/notification-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest fastapi httpx tzdata
      - run: python -m pytest -q tests/test_notification_center.py tests/test_notification_news.py tests/test_notification_news_analysis.py tests/test_notification_calendar.py tests/test_notification_api.py tests/test_notification_policy.py tests/test_notification_preferences.py tests/test_notification_push_queue.py tests/test_notification_bot_events.py tests/test_notification_market_integration.py tests/test_notification_news_sync.py
