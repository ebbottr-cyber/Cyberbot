name: EBBot kaynaklari - piyasa envanteri ve Solana gozlemi
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-inventory.yml'
      - 'tools/refresh_universe.py'
      - 'tools/solana_snapshot.py'
      - 'vendor/ebbot/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: EBBot listing sources
        run: python -m tools.refresh_universe
      - name: Public Solana observation
        run: python -m tools.solana_snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-inventory-and-solana-observations
          path: var/inventory/
          retention-days: 7
          if-no-files-found: error
