name: AI native runtime smoke
on:
  push:
    branches:
      - integration/central-market-panel-20261127
      - main
    paths:
      - '.github/workflows/ai-native-smoke.yml'
      - 'tools/local_research/river*.py'
      - 'tools/dexterm_river_experiment.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ai-native-smoke.yml'
      - 'tools/local_research/river*.py'
      - 'tools/dexterm_river_experiment.py'
  workflow_dispatch:
concurrency:
  group: ai-native-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  river:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native River runtime
        run: python -m pip install --only-binary=:all: 'river==0.23.0'
      - name: Exercise actual River replay and measure CPU and memory
        run: |
          /usr/bin/time -v python - <<'PY'
          import json, math, time, river
          from tools.local_research.river_review import evaluate
          from tools.local_research.river_journal import replay
          from tools.local_research.river_live_shadow import make_model
          from datetime import datetime, timedelta, timezone
          started = time.monotonic()
          p = [100.]
          for i in range(10000):
              p.append(p[-1]*(1+0.001*math.sin(i/7)))
          result = evaluate(p)
          assert result['updates'] == 9980
          assert result['scored'] == 9920
          assert all(math.isfinite(v) for v in result['paired_mae_pct'].values())
          assert result['real_orders'] is False
          assert result['automatic_promotion'] is False
          rows = []
          start = datetime(2020, 1, 1, tzinfo=timezone.utc)
          for i in range(1000):
              t = start + timedelta(minutes=i*22)
              y = 0.1*math.sin(i/7)
              pred = {'naive':0., 'mean':0.05*math.sin(i/7), 'ar1':0.04*math.cos(i/7), 'chronos':0.08*math.sin(i/7)}
              payload = dict(mode='forward_shadow_research', context_bars=21, prediction_bars=1, automatic_promotion=False, real_orders=False, last_price=100, predictions=pred)
              outcome = dict(actual_return_pct=y, target_source_at=(t+timedelta(seconds=50)).isoformat(), execution_verified=False, real_orders=False, absolute_errors_pct={k:abs(y-v) for k,v in pred.items()})
              rows.append((int(t.timestamp()//60),(t+timedelta(seconds=15)).isoformat(),json.dumps(payload),json.dumps(outcome)))
          a = replay(rows,make_model())
          b = replay(rows,make_model())
          assert a == b and a['scored'] == 940
          assert a['real_orders'] is False
          print(json.dumps({'river_version':river.__version__,'synthetic_price_updates':result['updates'],'replay_observations':a['observations'],'reconstruction_match':True,'elapsed_seconds':time.monotonic()-started,'real_orders':False},allow_nan=False))
          PY
