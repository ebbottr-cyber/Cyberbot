<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Obsidian | AI Analiz Merkezi</title><style>body{background:#0b1018;color:#e2e8f0;font:15px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:20px}h1,a{color:#2dd4bf}p,small{color:#a0aec0}section,article{background:#151e2b;border:1px solid #263449;border-radius:12px;padding:16px;margin:12px 0}article h3{margin-top:0}select,input,button{background:#193e42;color:#e2e8f0;border:1px solid #327a76;border-radius:6px;padding:10px;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}strong{color:#2dd4bf}</style><link rel="stylesheet" href="/ui/panel-mobile.css"></head><body><main><a href="/">← Ana panel</a><h1>AI ANALİZ MERKEZİ</h1><p>Çoklu araştırma rolleri · kural tabanlı ilk sürüm. Henüz dil modeli bağlı değil. İşlem yetkisi yok.</p><section><h2>Analiz kaynağı</h2><select id="mode"><option value="demo">Sentetik demo</option><option value="history">Yerel fiyat arşivi</option></select><select id="market"><option>BIST</option><option>NASDAQ</option><option>XETRA</option><option>SOLANA</option></select><input id="symbol" aria-label="Sembol" value="DEMO-BIST"><button id="run">Araştır</button><p id="msg" role="status"></p></section><div class="grid" id="agents"></div><section><strong>Sonuç: Yalnız araştırma</strong><p>Eksik haber, finansal ve makro veriler uydurulmaz. Bu rapor işlem sinyali değildir.</p></section></main><script>
const b=id=>document.getElementById(id);function setSymbol(){const m=b('market').value;b('symbol').value=b('mode').value==='demo'?'DEMO-'+(m==='SOLANA'?'SOL':m):({BIST:'THYAO.IS',NASDAQ:'AAPL',XETRA:'SAP.DE',SOLANA:''}[m])}
b('mode').onchange=setSymbol;b('market').onchange=setSymbol;
function elem(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
b('run').onclick=async()=>{b('run').disabled=true;b('agents').replaceChildren();try{const symbol=b('symbol').value.trim().toUpperCase();const url=b('mode').value==='demo'?'/api/analysis/demo/'+encodeURIComponent(symbol):'/api/analysis/history?'+new URLSearchParams({market:b('market').value,symbol});const r=await fetch(url),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'İstek başarısız.');b('msg').textContent=d.evidence.source+' · '+d.evidence.count+' gözlem · doğrulanmış canlı veri değil';for(const a of d.agents){const card=elem('article','');card.append(elem('h3',a.role),elem('strong',({hesaplandi:'Hesaplandı',senaryo:'Senaryo',sinirli:'Sınırlı kanıt',veri_yetersiz:'Yetersiz veri',veri_yok:'Veri yok',arastirma:'Araştırma'})[a.status]),elem('p',a.summary));for(const [k,v] of Object.entries(a.metrics))card.append(elem('p',({ortalama:'5 gözlem ortalaması',sapma_pct:'Ortalamadan sapma %',donem_getirisi_pct:'Dönem getirisi %',ortalama_uzerinde:'Ortalamanın üzerinde',gozlenen_dusus_pct:'Gözlenen düşüş %',maks_dusus_pct:'Azami düşüş %'})[k]+': '+(typeof v==='boolean'?(v?'Evet':'Hayır'):v)));b('agents').append(card)}}catch(e){b('msg').textContent=e.message}finally{b('run').disabled=false}};
b('run').click();
</script><nav class="module-bottom-nav" aria-label="Mobil hızlı erişim"><a href="/#overview">Özet</a><a href="/#markets">Piyasalar</a><a href="/#mobileModules">Menü</a><a href="/development">Gelişim</a><a href="/news">Haberler</a></nav></body></html>
