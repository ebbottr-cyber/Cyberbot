<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsidian | Öğrenme Merkezi</title><style>body{margin:0;background:#0b1018;color:#e2e8f0;font:15px system-ui}main{max-width:1100px;margin:auto;padding:20px}h1,a{color:#2dd4bf}section{background:#151e2b;border:1px solid #263449;border-radius:12px;padding:16px;margin:16px 0}p,small{color:#a0aec0}button,input,select{padding:10px;margin:4px;background:#193e42;color:#e2e8f0;border:1px solid #327a76;border-radius:6px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #263449}</style></head><body><main><a href="/">← Ana panel</a><h1>ÖĞRENME VE GELİŞİM MERKEZİ</h1><p>Çevrimdışı parametre araştırması · gerçek emir yok · otomatik terfi kapalı.</p><section><select id="mode"><option value="synthetic">Sentetik deney</option><option value="historical_unverified">Yerel arşiv</option></select><select id="market"><option>BIST</option><option>NASDAQ</option><option>XETRA</option></select><input id="symbol" value="THYAO.IS" aria-label="Hisse kodu"><button id="run">Yeni deney çalıştır</button><p id="msg" role="status"></p></section><section><h2>Deney sonuçları</h2><div class="scroll"><table><thead><tr><th>Strateji</th><th>Test bölümü</th><th>Pozitif bölüm</th><th>Birleşik %</th><th>En kötü bölüm düşüşü %</th><th>İşlem</th><th>Kazanma %</th><th>Durum</th></tr></thead><tbody id="results"></tbody></table></div><ul id="limits"></ul></section><section><h2>Deney geçmişi</h2><p id="counts"></p><div id="recent"></div></section></main><script>
const b=id=>document.getElementById(id);async function get(url,opt){const r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'İstek başarısız.');return d}function element(tag,text){const n=document.createElement(tag);n.textContent=text;return n}function show(d){b('results').replaceChildren();b('limits').replaceChildren();b('msg').textContent=(d.mode==='synthetic'?'Sentetik deney':'Yerel tarihsel, doğrulanmamış')+' · '+d.symbol+' · '+d.observations+' gözlem · 60/20 kayan pencere (40 eğitim, 20 ısınma)';for(const s of d.strategies){const tr=element('tr','');for(const v of [s.name,s.fold_count,s.positive_folds,s.compounded_pct,s.worst_fold_drawdown_pct,s.closed,s.win_pct,({referans:'Referans',yetersiz_islem:'Yetersiz işlem',inceleme_adayi:'İnceleme adayı',zayif_sonuc:'Zayıf sonuç'})[s.status]])tr.append(element('td',v??'—'));b('results').append(tr)}for(const x of d.limitations)b('limits').append(element('li',x))}
async function recent(){const d=await get('/api/learning');b('counts').textContent='Benzersiz sentetik deney: '+(d.counts.synthetic??0)+' · Tarihsel deney: '+(d.counts.historical_unverified??0);b('recent').replaceChildren();for(const x of d.recent){const btn=element('button',x.symbol+' · '+x.created_at.slice(0,19)+' UTC');btn.onclick=async()=>{try{show(await get('/api/learning/experiment/'+x.id))}catch(e){b('msg').textContent=e.message}};b('recent').append(btn)}}
b('market').onchange=()=>b('symbol').value={BIST:'THYAO.IS',NASDAQ:'AAPL',XETRA:'SAP.DE'}[b('market').value];b('run').onclick=async()=>{b('run').disabled=true;try{const d=await get('/api/learning/run?'+new URLSearchParams({mode:b('mode').value,market:b('market').value,symbol:b('symbol').value.trim().toUpperCase()}),{method:'POST',headers:{'X-Cyberbot-Paper':'1'}});show(d.experiment);b('msg').textContent+=' · '+(d.new?'Yeni kayıt':'Aynı deney, tekrar sayılmadı');await recent()}catch(e){b('msg').textContent=e.message}finally{b('run').disabled=false}};recent().catch(e=>b('counts').textContent=e.message);
</script></body></html>
