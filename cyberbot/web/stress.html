<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsidian | Stres Testi</title><style>body{background:#0b1018;color:#e2e8f0;font:15px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:20px}h1,a{color:#35c9ba}section{background:#171e2a;padding:16px;border-radius:12px;margin:12px 0}p,small{color:#9aa8ba}button,select{min-height:44px;padding:8px;background:#193e42;color:#e2e8f0;border:1px solid #327a76;border-radius:8px;margin:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:12px;background:#0b1018;border-radius:8px}.metric b{display:block;font-size:21px;margin-top:5px;overflow-wrap:anywhere}svg{display:block;width:100%;max-height:220px}</style></head><body><main><a href="/">← Ana panel</a><h1>RİSK VE STRES TESTİ</h1><p>Mevcut risk motoru · ayrı geçici sanal defter · gerçek emir yok.</p><section><select id="scenario"><option value="bull">Yükseliş</option><option value="bear">Düşüş</option><option value="sideways">Yatay</option><option value="gap" selected>Ani düşüş / fiyat boşluğu</option></select><button id="run">240 gözlemle test et</button><p id="status" role="status"></p></section><section><div class="grid" id="metrics"></div><svg viewBox="0 0 360 120" role="img" aria-label="Sentetik portföy eğrisi"><path id="line" stroke="#35c9ba" stroke-width="2" fill="none"/></svg><ul id="limits"></ul></section></main><script>
const b=id=>document.getElementById(id);function node(t,s){const n=document.createElement(t);n.textContent=s;return n}b('run').onclick=async()=>{b('run').disabled=true;b('metrics').replaceChildren();b('limits').replaceChildren();b('line').setAttribute('d','');b('status').textContent='Sentetik stres testi çalışıyor…';try{const r=await fetch('/api/stress/run?'+new URLSearchParams({scenario:b('scenario').value}),{method:'POST',headers:{'X-Cyberbot-Paper':'1'}}),d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Test başarısız.');b('status').textContent=d.label+' · '+(d.passed?'Motor kontrolleri başarılı':'Motor kontrol hatası')+' · kârlılık kanıtı değil';for(const [k,v] of [['Son sanal bakiye','$'+d.final_equity],['Getiri',d.return_pct+'%'],['Maksimum düşüş',d.max_recorded_drawdown_pct+'%'],['Reddedilen giriş',d.rejected_entries],['Kapanan işlem',d.closed_trades],['Stop çıkışı',d.stop_exits]]){const box=node('div','');box.className='metric';box.append(node('small',k),node('b',v));b('metrics').append(box)}const a=d.curve.map(p=>Number(p.equity)),lo=Math.min(...a),hi=Math.max(...a),span=Math.max(hi-lo,.01);b('line').setAttribute('d',a.map((v,i)=>(i?'L':'M')+(4+i*352/(a.length-1))+' '+(110-100*(v-lo)/span)).join(' '));for(const x of [...d.limits,...d.invariant_violations])b('limits').append(node('li',x))}catch(e){b('status').textContent=e.message}finally{b('run').disabled=false}};
</script></body></html>
