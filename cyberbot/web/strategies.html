<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obsidian | Strateji Laboratuvarı</title><style>body{margin:0;background:#0b1018;color:#e2e8f0;font:15px system-ui}main{max-width:1100px;margin:auto;padding:20px}h1,a{color:#2dd4bf}section{background:#151e2b;border:1px solid #263449;border-radius:12px;padding:16px;margin:16px 0}p,small{color:#a0aec0}button,input,select{padding:10px;margin:4px;background:#193e42;color:#e2e8f0;border:1px solid #327a76;border-radius:6px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #263449}.positive{color:#2dd4bf}.negative{color:#f87171}</style></head><body><main><a href="/">← Ana panel</a><h1>STRATEJİ LABORATUVARI</h1><p>Bağımsız geçmiş veri deneyleri · gerçek emir yok · otomatik terfi yok.</p><section><select id="mode"><option value="demo">Sentetik demo</option><option value="history">Yerel arşiv</option></select><select id="market"><option>BIST</option><option>NASDAQ</option><option>XETRA</option></select><input id="symbol" value="THYAO.IS" aria-label="Hisse kodu"><button id="run">Karşılaştır</button><p id="msg" role="status"></p></section><section><h2>Eğitim / ileri dönem karşılaştırması</h2><div class="scroll"><table><thead><tr><th>Strateji</th><th>Pencere</th><th>Eğitim %</th><th>İleri dönem %</th><th>Azami düşüş %</th><th>Kapalı işlem</th><th>Kazanma %</th></tr></thead><tbody id="results"></tbody></table></div><p id="cost"></p><ul id="limits"></ul></section></main><script>
const b=id=>document.getElementById(id);b('market').onchange=()=>b('symbol').value={BIST:'THYAO.IS',NASDAQ:'AAPL',XETRA:'SAP.DE'}[b('market').value];
b('run').onclick=async()=>{b('run').disabled=true;b('results').replaceChildren();b('limits').replaceChildren();try{const url=b('mode').value==='demo'?'/api/strategies/demo':'/api/strategies/history?'+new URLSearchParams({market:b('market').value,symbol:b('symbol').value.trim().toUpperCase()});const res=await fetch(url),d=await res.json();if(!res.ok)throw Error(typeof d.detail==='string'?d.detail:'İstek başarısız.');b('msg').textContent=(d.mode==='synthetic'?'Sentetik, gerçek getiri değil':'Yerel tarihsel, doğrulanmamış')+' · '+d.observations+' gözlem · eğitim '+d.training_observations+' · ileri dönem '+d.holdout_observations;b('cost').textContent='Tek yön ücret '+d.fee_bps+' bp · kayma '+d.slippage_bps+' bp';for(const s of d.strategies){const tr=document.createElement('tr');for(const v of [s.name,s.window,s.training_return_pct,s.holdout_return_pct,s.holdout_drawdown_pct,s.closed,s.win_pct]){const td=document.createElement('td');td.textContent=v??'—';tr.append(td)}b('results').append(tr)}for(const x of d.limitations){const li=document.createElement('li');li.textContent=x;b('limits').append(li)}}catch(e){b('msg').textContent=e.message}finally{b('run').disabled=false}};b('run').click();
</script></body></html>
