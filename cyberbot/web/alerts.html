<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Obsidian | Uyarı Merkezi</title><link rel="stylesheet" href="/ui/panel-mobile.css"><style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#171e2a;--accent:#35c9ba;--muted:#9aa8ba}body{margin:0;background:var(--bg);color:#e2e8f0;font:15px system-ui}main{max-width:950px;margin:auto;padding:max(20px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}a,h1{color:var(--accent)}h1{font-size:24px}p,small{color:var(--muted)}.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}.card,article{background:var(--panel);padding:14px;border:1px solid #263449;border-radius:12px;min-width:0}.card b{display:block;font-size:24px;margin-top:4px}.critical{color:#f87171}.warning{color:#fbbf24}.info{color:#5eead4}article{margin:10px 0;border-left-width:3px}article[data-severity=critical]{border-left-color:#f87171}article[data-severity=warning]{border-left-color:#fbbf24}article[data-severity=info]{border-left-color:#35c9ba}article h2{font-size:17px;margin:6px 0}article p{overflow-wrap:anywhere}article a{display:inline-flex;align-items:center;min-height:44px}button,select{background:#193e42;color:#e2e8f0;border:1px solid #327a76;border-radius:8px;padding:8px;margin:3px}label{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px}.filters{display:flex;flex-wrap:wrap;gap:8px}@media(max-width:340px){.counts{grid-template-columns:1fr}}
</style></head><body><main><a href="/">← Ana panel</a><h1>UYARI MERKEZİ</h1><p>Sistem, veri, araştırma ve kayıtlı sanal risk durumu. Telefon push bildirimi değildir.</p><div class="counts"><div class="card"><small>Kritik</small><b class="critical" id="critical">—</b></div><div class="card"><small>Uyarı</small><b class="warning" id="warning">—</b></div><div class="card"><small>Bilgi</small><b class="info" id="info">—</b></div></div><div class="filters"><label>Önem <select id="severity"><option value="all">Tümü</option><option value="critical">Kritik</option><option value="warning">Uyarı</option><option value="info">Bilgi</option></select></label><label>Kategori <select id="category"><option value="all">Tümü</option><option value="system">Sistem</option><option value="data">Veri</option><option value="learning">Araştırma</option><option value="risk">Risk</option></select></label><button id="refresh" type="button">Yenile</button></div><p id="status" role="status" aria-live="polite">Uyarılar okunuyor…</p><div id="items"></div><small>Uyarılar yerel kayıtlar ve raporlar üzerinden hesaplanır. Canlı piyasa alarmı, sürekli izleme veya otomatik emir değildir.</small></main><script>
const b=id=>document.getElementById(id),node=(tag,t,cls)=>{const e=document.createElement(tag);e.textContent=t;if(cls)e.className=cls;return e};
const severityNames={critical:'Kritik',warning:'Uyarı',info:'Bilgi'},categoryNames={system:'Sistem',data:'Veri',learning:'Araştırma',risk:'Risk'};
const links=new Set(['/health','/development','/data','/#portfolio','/models']);let report=null,generation=0;
function clear(msg){generation++;report=null;b('items').replaceChildren();for(const s of Object.keys(severityNames))b(s).textContent='—';b('status').textContent=msg;b('refresh').disabled=!navigator.onLine}
function draw(){const root=b('items');root.replaceChildren();if(!report)return;const items=report.items.filter(x=>(b('severity').value==='all'||x.severity===b('severity').value)&&(b('category').value==='all'||x.category===b('category').value));if(!items.length)root.append(node('p','Bu filtrede uyarı yok.'));for(const x of items){const el=node('article','');el.dataset.severity=x.severity;el.append(node('small',severityNames[x.severity]+' · '+categoryNames[x.category],x.severity),node('h2',x.title),node('p',x.message));if(links.has(x.link)){const a=node('a','İlgili merkezi aç');a.href=x.link;el.append(a)}root.append(el)}}
async function load(){if(!navigator.onLine){clear('Bağlantı yok; uyarılar güncel değil.');return}const g=++generation;b('refresh').disabled=true;try{const r=await fetch('/api/alerts',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(g!==generation||!navigator.onLine)return;report=d;for(const s of Object.keys(severityNames))b(s).textContent=d.counts[s];b('status').textContent='Yerel kontrol: '+new Date(d.as_of).toLocaleString('tr-TR',{timeZone:'Europe/Istanbul'})+' TSİ';draw()}catch{if(g===generation)clear('Uyarılar okunamadı; önceki kayıtlar gösterilmiyor.')}finally{if(g===generation)b('refresh').disabled=!navigator.onLine}}
b('severity').onchange=draw;b('category').onchange=draw;b('refresh').onclick=load;window.addEventListener('offline',()=>clear('Bağlantı yok; uyarılar güncel değil.'));window.addEventListener('online',load);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});load();setInterval(()=>{if(document.visibilityState==='visible')load()},60000);
</script></body></html>
